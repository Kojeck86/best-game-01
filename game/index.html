<!DOCTYPE html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Emberlight — A Moth's Harvest</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #070a1e;
    overflow: hidden;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  #wrap {
    width: min(100vw, calc(100vh * 1.6));
    aspect-ratio: 8 / 5;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    image-rendering: auto;
  }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="game" width="960" height="600" aria-label="Emberlight game canvas"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
